name: dockerized-test

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:
  

jobs:
  dockerized-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby_version: ['3.3', '3.4']

    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    - name: Set up ruby
      uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1
      with:
        ruby-version: ${{ matrix.ruby_version }}

    - name: Build the lib
      run: make build

    - name: Build the image
      run: docker build . -t local/test -f Dockerfile.test --build-arg BASE_IMAGE=public.ecr.aws/lambda/ruby:${{ matrix.ruby_version }}

    - name: Run tests
      uses: aws/containerized-test-runner-for-aws-lambda@511d270614f2c6b1613848db6dcf920a591c3c89 # main
      with:
        suiteFileArray: '["./test/dockerized/suites/*.json"]'
        dockerImageName: 'local/test'
        taskFolder: './test/dockerized/tasks'
